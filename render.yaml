services:
  - type: web
    name: civicresolve
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: '8080'
      - key: ADMIN_PASSCODE
        value: civic-admin-2026
      - key: SESSION_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
